<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.2" intercept="-.1"/><feFuncG type="linear" slope="1.2" intercept="-.1"/><feFuncB type="linear" slope="1.2" intercept="-.1"/><feFuncA type="linear" slope=".26"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="768" height="768" fill="#808080" opacity=".8" filter="url(#grain)"/>
</svg>
